[project]
name = "boostify"
version = "0.1.0"
description = "Bot Discord para registrar mensagens de boost"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["discord.py==2.6.4", "python-dotenv==1.2.1", "pyyaml (>=6.0.3,<7.0.0)"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
